name: Rotate DB Credentials

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install hvac requests python-dotenv

      - name: Install Vault
        run: |
          wget -qO- https://releases.hashicorp.com/vault/1.19.0/vault_1.19.0_linux_amd64.zip -O vault.zip
          unzip vault.zip
          sudo mv vault /usr/local/bin/
          vault version

      - name: Start Vault dev server
        run: |
          vault server -dev -dev-root-token-id="test-root-token" &
          sleep 3
          export VAULT_ADDR=http://127.0.0.1:8200
          export VAULT_TOKEN=test-root-token
          vault status

      - name: Seed Vault with secrets and policies
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: python src/vault/setup_vault.py

      - name: Rotate DB credentials
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: |
          python -c "
          from src.rotation.rotate_secrets import get_client, rotate_db_credentials
          client = get_client()
          result = rotate_db_credentials(client)
          assert result, 'DB credential rotation failed'
          print('DB credential rotation completed successfully')
          "

      - name: Verify rotation
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: |
          python -c "
          from src.rotation.rotate_secrets import get_client, read_current_secret
          client = get_client()
          data, version = read_current_secret(client, 'db-credentials/postgres-main')
          assert version == 2, f'Expected version 2, got {version}'
          assert 'rotated_at' in data, 'Missing rotated_at timestamp'
          print(f'Verified: version {version}, rotated_at {data[\"rotated_at\"]}')
          "