name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install hvac requests python-dotenv pytest pytest-cov pyyaml

      - name: Install Vault
        run: |
          wget -qO- https://releases.hashicorp.com/vault/1.19.0/vault_1.19.0_linux_amd64.zip -O vault.zip
          unzip vault.zip
          sudo mv vault /usr/local/bin/
          vault version

      - name: Start Vault dev server
        run: |
          vault server -dev -dev-root-token-id="test-root-token" &
          sleep 3

      - name: Seed Vault
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: python src/vault/setup_vault.py

      - name: Run Vault policy tests
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: python -m pytest tests/unit/test_vault_policies.py -v

      - name: Run rotation tests
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: python -m pytest tests/unit/test_rotation.py -v

      - name: Run coverage on testable modules
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: python -m pytest tests/unit/test_vault_policies.py tests/unit/test_rotation.py -v --cov=src.rotation --cov=src.vault --cov-report=term-missing