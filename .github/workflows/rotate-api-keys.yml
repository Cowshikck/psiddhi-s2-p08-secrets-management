name: Rotate API Keys

on:
  schedule:
    - cron: '0 2 * * 3'  # Every Wednesday at 2 AM UTC
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install hvac requests python-dotenv

      - name: Install Vault
        run: |
          wget -qO- https://releases.hashicorp.com/vault/1.19.0/vault_1.19.0_linux_amd64.zip -O vault.zip
          unzip vault.zip
          sudo mv vault /usr/local/bin/
          vault version

      - name: Start Vault dev server
        run: |
          vault server -dev -dev-root-token-id="test-root-token" &
          sleep 3

      - name: Seed Vault and rotate API key
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: |
          python src/vault/setup_vault.py
          python -c "
          from src.rotation.rotate_secrets import get_client, rotate_api_key
          client = get_client()
          result = rotate_api_key(client)
          assert result, 'API key rotation failed'
          print('API key rotation completed successfully')
          "

      - name: Verify rotation
        env:
          VAULT_ADDR: http://127.0.0.1:8200
          VAULT_TOKEN: test-root-token
        run: |
          python -c "
          from src.rotation.rotate_secrets import get_client, read_current_secret
          client = get_client()
          data, version = read_current_secret(client, 'api-keys/payment-gateway')
          assert version == 2, f'Expected version 2, got {version}'
          print(f'Verified: version {version}')
          "